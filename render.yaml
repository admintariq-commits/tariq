services:
  - type: web
    name: tariq
    env: docker
    branch: main
    dockerfilePath: Dockerfile
    plan: free
    autoDeploy: true
    buildCommand: composer install --no-interaction --ignore-platform-reqs
    postBuildCommand: |
      mkdir -p database storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
      if [ "$DB_CONNECTION" = "sqlite" ]; then
        touch database/database.sqlite
      fi
      chmod -R 775 database storage bootstrap/cache
      php artisan optimize:clear
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: LOG_LEVEL
        value: debug
      - key: APP_URL
        value: 'https://tariq-bii6.onrender.com'
      - key: OTP_DEV
        value: 'false'
      - key: OTP_COOLDOWN_SECONDS
        value: '60'
      - key: SMS_PROVIDER
        value: 'nextsms'
      - key: NEXTSMS_API_TOKEN
        value: ''
      - key: NEXTSMS_USERNAME
        value: 'josiahmarco93.e9b'
      - key: NEXTSMS_PASSWORD
        value: 'prince$$127'
      - key: NEXTSMS_BASE_URL
        value: 'https://messaging-service.co.tz/api/sms/v2/text/single'
      - key: NEXTSMS_SENDER
        value: 'UniMessage'
      - key: OTP_TEST_PHONES
        value: ''
      - key: SESSION_DRIVER
        value: file
      - key: SESSION_SECURE_COOKIE
        value: 'false'
      - key: SESSION_SAME_SITE
        value: lax
      - key: CACHE_DRIVER
        value: file
      - key: LOG_CHANNEL
